name: Node.js Package

on:
  release:
    types: [created]
  workflow_dispatch:

jobs:
  publish-npm:
    runs-on: [self-hosted, Linux, X64, beast-unit]
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: rm -rf node_modules package-lock.json && npm install

      - name: Check if version is already published
        id: version-check
        run: |
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          LOCAL_VERSION=$(node -p "require('./package.json').version")
          PUBLISHED_VERSION=$(npm view "$PACKAGE_NAME@$LOCAL_VERSION" version 2>/dev/null || echo "")
          if [ "$LOCAL_VERSION" = "$PUBLISHED_VERSION" ]; then
            echo "Version $LOCAL_VERSION is already published. Skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "Publishing $LOCAL_VERSION (not yet on npm)"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Typecheck
        if: steps.version-check.outputs.skip != 'true'
        run: npm run typecheck

      - name: Lint
        if: steps.version-check.outputs.skip != 'true'
        run: npm run lint

      - name: Test
        if: steps.version-check.outputs.skip != 'true'
        run: npm run test

      - name: Install Playwright browsers
        if: steps.version-check.outputs.skip != 'true'
        # No --with-deps: this is a long-lived self-hosted runner, so the
        # browser's system libraries belong to its image. Running apt on every
        # release is what let a wedged dpkg state block publishing entirely.
        run: npx playwright install chromium

      - name: E2E tests
        if: steps.version-check.outputs.skip != 'true'
        run: npm run test:e2e

      - name: Build package
        if: steps.version-check.outputs.skip != 'true'
        run: npm run build:all

      - name: Resolve npm dist-tag
        id: disttag
        if: steps.version-check.outputs.skip != 'true'
        run: |
          VERSION=$(node -p "require('./package.json').version")
          case "$VERSION" in
            *-*) echo "tag=rc" >> "$GITHUB_OUTPUT" ;;
            *) echo "tag=latest" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Publish package
        if: steps.version-check.outputs.skip != 'true'
        run: npm publish --provenance --access public --tag ${{ steps.disttag.outputs.tag }}
