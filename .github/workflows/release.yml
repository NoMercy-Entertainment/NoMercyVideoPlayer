name: Create Release

on:
  workflow_dispatch:

jobs:
  create-release:
    runs-on: self-hosted

    steps:
      # Step 1: Check out the code
      - name: Checkout code
        uses: actions/checkout@v5

      # Step 2: Set up Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20

      # Step 3: Read the version from package.json
      - name: Get version from package.json
        id: get_version
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          echo "PACKAGE_VERSION=${PACKAGE_VERSION}" >> $GITHUB_ENV

      # Step 4: Create the tag
      - name: Create tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Idempotent on re-runs / self-hosted runners that keep a stale local tag.
          git tag -d "${PACKAGE_VERSION}" 2>/dev/null || true
          git push origin ":refs/tags/${PACKAGE_VERSION}" 2>/dev/null || true
          git tag -a "${PACKAGE_VERSION}" -m "Release ${PACKAGE_VERSION}"
          git push origin "${PACKAGE_VERSION}"

      # Step 5: Create GitHub release
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.PACKAGE_VERSION }}
          name: Release ${{ env.PACKAGE_VERSION }}
          draft: false
          prerelease: ${{ contains(env.PACKAGE_VERSION, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
